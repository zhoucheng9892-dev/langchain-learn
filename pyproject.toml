[project]
name = "langchain-learn"
version = "0.1.0"
description = "LangChain 1.x 从入门到精通：12 章讲义 + 33 个可运行示例（DeepSeek 实战）"
readme = "README.md"
authors = [
    { name = "benny周", email = "czhou@hk.chinamobile.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langchain-deepseek>=1.1.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-learn = "langchain_learn:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
